version: '3.8'

# DEVELOPMENT DOCKER COMPOSE
# This file mounts src/ directory for live code changes without rebuilding

networks:
  magiva-vision-network:
    name: magiva-vision-network
    driver: bridge

volumes:
  yolo-models:
  tracking-data:
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  minio_data:
    driver: local

services:
  ingress-egress-tracking-service:
    container_name: ingress-egress-tracking-service-dev
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Service Configuration
      SERVICE_NAME: ingress-egress-tracking-service-dev
      LOG_LEVEL: DEBUG  # More verbose logging for development

      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8100

      # NATS Configuration
      NATS_URL: nats://nats:4222
      NATS_LINE_CONFIG_SUBJECT: config.tracking.lines
      NATS_QUEUE_GROUP: tracking-service
      NATS_MAX_PENDING: 1000
      NATS_FRAME_SUBJECT: frames.ml.vehicle_ingress_egress  # Single topic with frame + line config
      NATS_CONSUMER_MODE: unified  # Use unified consumer
      # Kafka Configuration
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_PREFIX: tracking.events
      KAFKA_LINGER_MS: 100

      # MinIO Configuration
      MINIO_BUCKET_NAME: vehicle-tracking
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123

      # Model Configuration
      CAR_MODEL_NAME: ./Models/car_detection.pt
      CAR_MODEL_CONFIDENCE: 0.6
      CAR_MODEL_IOU_THRESHOLD: 0.4
      MODEL_DEVICE: cuda:0

      # Tracker Configuration
      TRACKER_MAX_AGE: 120
      TRACKER_MIN_HITS: 10

      # Line Crossing Detection Parameters
      CROSSING_DISTANCE_THRESHOLD: 20.0
      CROSSING_CONFIRMATION_FRAMES: 3
      CROSSING_HYSTERESIS: 5.0

      # Quality Configuration
      MIN_CROP_AREA_RATIO: 0.05
      BLUR_THRESHOLD: 100
      PADDING_TO_CROP: 0.1

      # Save Configuration
      SAVE_VEHICLE_CROPS: "true"
      SAVE_CROSSING_EVENTS_ONLY: "true"

      # Multi-Camera Production Settings
      MAX_CAMERAS: 10
      MAX_TRACKS_PER_CAMERA: 100
      CAMERA_FRAME_TIMEOUT: 5.0
      ENABLE_PER_CAMERA_METRICS: "true"

      # Discord (disabled for dev)
      DISCORD_ENABLED: "false"

      # Ultralytics config directory (fix for warning)
      YOLO_CONFIG_DIR: /tmp/Ultralytics

      # Python unbuffered output (see logs immediately)
      PYTHONUNBUFFERED: 1

    ports:
      - "8100:8100"

    networks:
      - magiva-vision-network

    depends_on:
      - nats
      - kafka
      - minio

    volumes:
      # ⭐ MOUNT SOURCE CODE FOR LIVE CHANGES
      - ./src:/app/src:rw

      # Mount models (read-only)
      - ./Models:/app/Models:ro

      # Cache directories
      - yolo-models:/root/.cache/torch/hub
      - tracking-data:/app/data

      # Ultralytics config (fix warning)
      - /tmp/Ultralytics:/tmp/Ultralytics

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8100/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  # NATS server
  nats:
    image: nats:latest
    container_name: nats-dev
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - magiva-vision-network
    command: ["-js", "-m", "8222"]
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: magic_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - magiva-vision-network
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo 'srvr' | nc localhost 2181 | grep -q 'Zookeeper version'" ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
  # Kafka message broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: magic_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      # - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - magiva-vision-network
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    
  
    # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: magic_kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"
    networks:
      - magiva-vision-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
  # MinIO for object storage
  minio:
    image: minio/minio:latest
    container_name: magic-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - magiva-vision-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: magic_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123; /usr/bin/mc mb myminio/magic-documents --ignore-existing; /usr/bin/mc mb myminio/magic-artifacts --ignore-existing; /usr/bin/mc mb myminio/magic-temp --ignore-existing; /usr/bin/mc anonymous set public myminio/magic-documents; exit 0; "
    networks:
      - magiva-vision-network

  